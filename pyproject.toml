[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pgcopy-lint"
version = "0.1.0"
description = "Offline streaming lint for PostgreSQL UTF-8 COPY text payloads."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "KanadeK"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
pgcopy-lint = "pgcopy_lint.cli:main"

[project.urls]
Repository = "https://github.com/KanadeK/pgcopy-lint"
Issues = "https://github.com/KanadeK/pgcopy-lint/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
